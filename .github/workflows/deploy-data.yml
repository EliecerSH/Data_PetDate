name: Deploy Data Layer to EKS

on:
  push:
    branches: [ deploy ]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: petdate-cluster

jobs:
  deploy-data-layer:
    name: Bootstrap namespace, Secret, ConfigMap, Storage y MongoDB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Apply namespace
        run: kubectl apply -f k8s/00-namespace.yaml

      - name: Create or update petdate-secrets (desde GitHub Secrets)
        env:
          JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          MONGO_USER: ${{ secrets.APP_MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.APP_MONGO_PASSWORD }}
          MONGO_DATABASE: ${{ secrets.APP_MONGO_DATABASE }}
          MAIL_USERNAME: ${{ secrets.APP_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.APP_MAIL_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.APP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
        run: |
          MONGO_URI="mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin"
          kubectl create secret generic petdate-secrets -n petdate \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=MONGO_USER="$MONGO_USER" \
            --from-literal=MONGO_PASSWORD="$MONGO_PASSWORD" \
            --from-literal=MONGO_DATABASE="$MONGO_DATABASE" \
            --from-literal=SPRING_DATA_MONGODB_URI="$MONGO_URI" \
            --from-literal=MAIL_USERNAME="$MAIL_USERNAME" \
            --from-literal=MAIL_PASSWORD="$MAIL_PASSWORD" \
            --from-literal=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/02-configmap.yaml

      - name: Apply Storage (EFS StorageClass/PV/PVC)
        env:
          EFS_FILE_SYSTEM_ID: ${{ secrets.EFS_FILE_SYSTEM_ID }}
        run: |
          sed -i "s/fs-EFSID/${EFS_FILE_SYSTEM_ID}/g" k8s/03-storage.yaml
          kubectl apply -f k8s/03-storage.yaml

      - name: Deploy MongoDB (StatefulSet) + backup CronJob
        run: |
          kubectl apply -f k8s/data/mongodb.yaml
          kubectl apply -f k8s/data/mongo-backup-cronjob.yaml
          kubectl rollout status statefulset/mongodb -n petdate --timeout=180s

      - name: Show data layer status
        run: |
          kubectl get pods -n petdate -l app=mongodb -o wide
          kubectl get pvc -n petdate
