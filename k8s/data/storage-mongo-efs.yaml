# =====================================================================
# Almacenamiento de MongoDB y de los backups sobre EFS (NO sobre EBS).
#
# Por que: el EBS CSI driver dinamico necesita permisos IAM
# (ec2:DescribeAvailabilityZones, CreateVolume, AttachVolume, etc.) que
# AWS Academy Learner Lab no permite otorgar al rol del nodo (no se puede
# hacer iam:AttachRolePolicy ni iam:PutRolePolicy). En cambio, un volumen
# EFS estatico solo necesita montar NFS via la IP del mount target (DNS),
# sin ninguna llamada a la API de EC2/IAM en tiempo de ejecucion. Usamos
# el MISMO File System EFS que k8s/03-storage.yaml (fs-EFSID), separando
# los datos con "subPath" en cada Deployment/StatefulSet/CronJob:
#   - mongo-data-pvc    -> subPath "mongodb"      (datos de Mongo)
#   - mongo-backup-pvc  -> subPath "mongo-backups" (dumps diarios)
#
# Prerrequisito: el mismo de k8s/03-storage.yaml (EFS creado + addon
# aws-efs-csi-driver instalado). Reemplazar fs-EFSID con el ID real
# (el pipeline deploy-data.yml ya lo hace con sed, igual que con
# k8s/03-storage.yaml).
# =====================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-data-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-EFSID
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data-pvc
  namespace: petdate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: efs-sc
  volumeName: mongo-data-pv
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-backup-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-EFSID
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-backup-pvc
  namespace: petdate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: efs-sc
  volumeName: mongo-backup-pv
  resources:
    requests:
      storage: 10Gi
